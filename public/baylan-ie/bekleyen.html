<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024, height=768, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Kırklareli Kiosk</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a1f38;
    color: #fff;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #f0f4f8;
    display: none;
  }
  #frame.is-on { display: block; }
  #wait {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2.5rem;
    background: linear-gradient(180deg, #1e5a9e 0%, #123a6b 55%, #0a1f38 100%);
  }
  #wait.is-hidden { display: none; }
  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 999px;
    padding: 0.45rem 1.1rem;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  h1 {
    font-size: 2.25rem;
    font-weight: 800;
    line-height: 1.15;
    margin: 1.1rem 0 0.75rem;
    max-width: 820px;
  }
  .msg {
    font-size: 1.25rem;
    line-height: 1.45;
    opacity: 0.92;
    max-width: 720px;
    margin: 0;
  }
  .clock {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    margin: 1.4rem 0 0.35rem;
  }
  .hint {
    font-size: 0.95rem;
    opacity: 0.75;
    margin-top: 0.25rem;
  }
  .support {
    margin-top: 2rem;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 1rem;
    padding: 1rem 1.5rem;
    min-width: 280px;
  }
  .support .label { font-size: 0.8rem; opacity: 0.8; margin-bottom: 0.25rem; }
  .support .phone { font-size: 1.75rem; font-weight: 800; letter-spacing: 0.04em; }
  .brand {
    position: absolute;
    top: 0; left: 0;
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.25rem 2rem;
    text-align: left;
  }
  .brand .name { font-size: 1.05rem; font-weight: 700; }
  .brand .sub { font-size: 0.9rem; opacity: 0.9; margin-top: 0.15rem; }
</style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">
  <iframe id="frame" title="Kiosk" allow="fullscreen; payment" referrerpolicy="no-referrer-when-downgrade"></iframe>

  <div id="wait" role="status" aria-live="polite">
    <div class="brand">
      <div>
        <div class="name">T.C. Kırklareli Belediye Başkanlığı</div>
        <div class="sub">Akıllı Ödeme Sistemleri</div>
      </div>
    </div>
    <span class="badge">Sistem Bakımı</span>
    <h1>Sistem bakımdadır</h1>
    <p class="msg">Yakında devreye girecektir.</p>
    <div id="clock" class="clock">--:--:--</div>
    <p class="hint">Bağlantı bekleniyor…</p>
    <div class="support">
      <div class="label">Destek hattı</div>
      <div class="phone">444 01 39</div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  // Kiosk sunucu adresi (VPN üzerinden)
  var KIOSK_URL = 'http://10.0.1.1/kiosk/public/';
  var CHECK_MS = 5000;
  var SUPPORT = '444 01 39';

  var frame = document.getElementById('frame');
  var wait = document.getElementById('wait');
  var clock = document.getElementById('clock');
  var online = false;
  var checking = false;

  function pad2(n) { return String(n).padStart(2, '0'); }

  function tickClock() {
    var d = new Date();
    clock.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }

  function showWait() {
    wait.classList.remove('is-hidden');
    frame.classList.remove('is-on');
  }

  function showKiosk() {
    wait.classList.add('is-hidden');
    frame.classList.add('is-on');
  }

  /** Aynı pencerede temiz yükleme — yeni sekme açılmaz */
  function loadKioskFresh() {
    frame.removeAttribute('src');
    frame.src = 'about:blank';
    // Kısa gecikme ile önceki içeriği temizle, sonra kiosk’u yükle
    setTimeout(function () {
      frame.src = KIOSK_URL;
      showKiosk();
    }, 50);
  }

  function clearKiosk() {
    try { frame.src = 'about:blank'; } catch (e) {}
    frame.removeAttribute('src');
    showWait();
  }

  function reachable() {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 4000);
    return fetch(KIOSK_URL, {
      method: 'GET',
      mode: 'no-cors',
      cache: 'no-store',
      signal: ctrl.signal
    }).then(function () {
      clearTimeout(timer);
      return true;
    }).catch(function () {
      clearTimeout(timer);
      return false;
    });
  }

  function check() {
    if (checking) return;
    checking = true;
    reachable().then(function (up) {
      checking = false;
      if (up && !online) {
        online = true;
        loadKioskFresh();
      } else if (!up && online) {
        online = false;
        clearKiosk();
      }
    });
  }

  // iframe içinden target=_blank açılmasını mümkün olduğunca engelle
  frame.addEventListener('load', function () {
    try {
      var doc = frame.contentDocument;
      if (!doc) return;
      var base = doc.querySelector('base');
      if (!base) {
        base = doc.createElement('base');
        base.target = '_self';
        if (doc.head) doc.head.appendChild(base);
      } else {
        base.target = '_self';
      }
    } catch (e) {
      // çapraz köken — dokunamayız; kiosk kendi sayfasında kalmalı
    }
  });

  tickClock();
  setInterval(tickClock, 1000);
  check();
  setInterval(check, CHECK_MS);

  // Sayfa görünür olunca hemen kontrol et
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) check();
  });
})();
</script>
</body>
</html>
